name: Deploy Front
on: 
    push:
        branches: [ "daniel" ]
    pull_request:
        branches: [ "dev" ]
        types: [closed]
    workflow_dispatch:

jobs: 
  # if_merged:
  #   if: github.event.pull_request.merged == true
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v3

  #     - name: Confirm Merge
  #       run: echo "El PR ha sido aprobado y mergeado correctamente."

  build:
    runs-on: ubuntu-latest
    # needs: if_merged
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test --if-present  

    - name: Build Aplication
      env: 
        VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
      run: |
        npm run build --if-present && tsc --noEmit


    - name: List build output
      run: ls -l ./dist

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app 
        path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app
        path: ./dist

    - name: Configure SSH access
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ACCESS_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

    - name: Prepare VPS using SSH
      uses: appleboy/ssh-action@v1.1.0
      with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.ACCESS_KEY }}
          port: ${{ secrets.PORT}}
          script: |
            mv /var/www/stockify.vortexsoftware.net/ /var/backups || true 
            cd /var/www/stockify.vortexsoftware.net/
            rm -f *
            echo "Directorio preparado para nueva versión"

    - name: Transfer files to VPS
      run: |
        scp -r ./dist/* ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/stockify.vortexsoftware.net/ || exit 1
    
    - name: Validate Deployment
      uses: appleboy/ssh-action@v1.1.0
      with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.ACCESS_KEY }}
          port: ${{ secrets.PORT}}
          script: |
            cd /var/www/stockify.vortexsoftware.net/
            ls -l
            echo "Despliegue exitoso"
    
